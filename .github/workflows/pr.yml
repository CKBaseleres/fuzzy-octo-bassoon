name: PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Each step runs across every workspace (shared, api, web, infra).
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Later tickets add: axe checks (ticket 12) and Bicep what-if against dev (ticket 03).
